<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>FanPulse feature: Mini-boss warning before big boss waves</title>
<style>
:root{--bg:#0f0d14;--fg:#ece8f2;--mut:#a59fb3;--acc:#ff4fa3;--acc2:#2fd3c9;--card:#1a1622;--line:#2c2638}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:32px 20px 80px}
h1{font-size:2rem;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent}
h2{margin-top:2.2rem;border-left:4px solid var(--acc);padding-left:10px} h3{color:var(--acc2);font-size:1.25rem} h4{margin:1.2rem 0 .3rem;color:var(--fg)}
table{border-collapse:collapse;width:100%;font-size:.9rem;display:block;overflow-x:auto}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600} code{background:var(--card);padding:2px 5px;border-radius:4px;overflow-wrap:anywhere}
blockquote{margin:1rem 0;padding:12px 16px;background:#2a1a24;border-left:4px solid var(--acc);border-radius:6px}
hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
pre{background:var(--card);padding:12px;border-radius:8px;overflow-x:auto;font-size:.8rem;line-height:1.45}
.add{color:#5ee08a} .del{color:#ff7a8a}
img{max-width:100%;image-rendering:pixelated;border-radius:8px} em{color:var(--mut)} li{margin:.3rem 0}
</style></head><body><main id="c"></main><script>
const md="# Feature: Mini-boss warning before big boss waves\n\n**Request:** Add a mini-boss a few waves before each big boss wave: a weaker guardian of the same unit line, so players can see what is coming and prepare their defenses.\n\n**Player evidence:** 19 of 10,952 Steam reviews complain that bosses arrive without warning or as a sudden spike; one asks for exactly this.\n\n> Maybe add a mini boss here and there, that preps you for the big boss. Make the mini boss a simpler version of the boss, so you know what to prepare for.\n> The vawes are kinda basic, with a sudden HUGE boss after several easy waves.\n> Having a boss enemy just fly around your chokepoint would have been fine if any prior enemy had done so or there was any warning of it.\n> You need to gamble on how much defenses you need to build because you have no idea how strong the bosses are.\n\n**Draft by:** reference draft, hand-written by Claude (4 rounds; acceptance bar unchanged). Each main and alt boss wave is heralded 4, 3 and 2 waves earlier by a guardian from the same unit line, one tier lower, repeating on the boss's schedule. Random calls keep their original order, so all other waves are unchanged.\n\n## Verification: \u274c FAILED\n\n- \u2713 boss_warned = 1 (need \u2265 0.8)\n- \u2717 boss_spike -14.2% (need \u2264 -15%)\n- \u2713 threat_early +0.0% (must stay within \u00b12%)\n- \u2713 threat +3.2% (must stay within \u00b110%)\n\n| Metric | Before | After | Change |\n|---|---|---|---|\n| units | 585.800 | 590.400 | +0.8% |\n| threat_early | 64,197.100 | 64,197.100 | +0.0% |\n| threat_mid | 186,159.600 | 195,291.600 | +4.9% |\n| threat_late | 457,788.300 | 471,274.500 | +2.9% |\n| threat | 708,145.000 | 730,763.200 | +3.2% |\n| boss_spike | 1.879 | 1.612 | -14.2% |\n| boss_warned | 0.000 | 1.000 | new |\n\n```diff\n--- a/core/src/mindustry/game/Waves.java\n+++ b/core/src/mindustry/game/Waves.java\n@@ -367,8 +367,25 @@\n \n         int bossTier = difficulty < 0.6 ? 3 : 4;\n \n+        //mini-bosses: weaker guardians of a boss's unit line 4, 3 and 2 waves before it, so players can see it coming\n+        Cons2<UnitType[], Integer> heralds = (line, start) -> {\n+            for(int lead : new int[]{4, 3, 2}){\n+                out.add(new SpawnGroup(line[bossTier - 1]){{\n+                    unitAmount = 1;\n+                    begin = start - lead;\n+                    spacing = bossSpacing;\n+                    end = never;\n+                    max = 4;\n+                    unitScaling = bossSpacing;\n+                    shieldScaling = shieldsPerWave;\n+                    effect = StatusEffects.boss;\n+                }});\n+            }\n+        };\n+\n         //main boss progression\n-        out.add(new SpawnGroup(Structs.random(rand, species)[bossTier]){{\n+        UnitType[] bossLine = Structs.random(rand, species);\n+        out.add(new SpawnGroup(bossLine[bossTier]){{\n             unitAmount = 1;\n             begin = bossWave;\n             spacing = bossSpacing;\n@@ -379,10 +396,14 @@\n             effect = StatusEffects.boss;\n         }});\n \n-        //alt boss progression\n-        out.add(new SpawnGroup(Structs.random(rand, species)[bossTier]){{\n+        heralds.get(bossLine, bossWave);\n+\n+        //alt boss progression (line and start drawn in the original order, so the random sequence is unchanged)\n+        UnitType[] altLine = Structs.random(rand, species);\n+        int altBegin = bossWave + rand.random(3, 5) * bossSpacing;\n+        out.add(new SpawnGroup(altLine[bossTier]){{\n             unitAmount = 1;\n-            begin = bossWave + rand.random(3, 5) * bossSpacing;\n+            begin = altBegin;\n             spacing = bossSpacing;\n             end = never;\n             max = 16;\n@@ -390,6 +411,8 @@\n             shieldScaling = shieldsPerWave;\n             effect = StatusEffects.boss;\n         }});\n+\n+        heralds.get(altLine, altBegin);\n \n         int finalBossStart = 120 + rand.random(30);\n```\n";
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inl(s){return esc(s).replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2">').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\s][^*]*)\*(?=[^*\w]|$)/g,'$1<em>$2</em>').replace(/(^|\W)_([^_]+)_(?=\W|$)/g,'$1<em>$2</em>')}
let out=[],list=null,tbl=null;
function flush(){if(list){out.push('<'+list.t+'>'+list.items.join('')+'</'+list.t+'>');list=null}if(tbl){out.push('<table>'+tbl.join('')+'</table>');tbl=null}}
let pre=null;
for(const raw of md.split('\n')){const l=raw.trimEnd();let m;
 if(/^```/.test(l)){if(pre){out.push('<pre>'+pre.join('\n')+'</pre>');pre=null}else{flush();pre=[]}continue}
 if(pre){pre.push(esc(raw).replace(/^([+-](?![+-]{2}).*)$/,(x)=>'<span class="'+(x[0]==='+'?'add':'del')+'">'+x+'</span>'));continue}
 if(/^\|/.test(l)){if(/^\|[-| ]+\|$/.test(l))continue;const cells=l.slice(1,-1).split('|').map(c=>inl(c.trim()));
  const tag=tbl?'td':'th';tbl=tbl||[];tbl.push('<tr>'+cells.map(c=>'<'+tag+'>'+c+'</'+tag+'>').join('')+'</tr>');continue}
 if((m=l.match(/^(#{1,4}) (.*)/))){flush();out.push('<h'+m[1].length+'>'+inl(m[2])+'</h'+m[1].length+'>');continue}
 if((m=l.match(/^\s*[-*] (.*)/))){if(!list||list.t!=='ul'){flush();list={t:'ul',items:[]}}list.items.push('<li>'+inl(m[1])+'</li>');continue}
 if((m=l.match(/^\d+\. (.*)/))){if(!list||list.t!=='ol'){flush();list={t:'ol',items:[]}}list.items.push('<li>'+inl(m[1])+'</li>');continue}
 if((m=l.match(/^> ?(.*)/))){flush();out.push('<blockquote>'+inl(m[1])+'</blockquote>');continue}
 if(l==='---'){flush();out.push('<hr>');continue}
 if(!l){flush();continue} flush();out.push('<p>'+inl(l)+'</p>');}
flush();document.getElementById('c').innerHTML=out.join('\n');
</script></body></html>
