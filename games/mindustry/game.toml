# Mindustry trial: mass player feedback -> verified change in the real game code.
# Run games/mindustry/setup.sh once (clones v160.8 source + official server build, compiles the probe).
game = "Mindustry"

[analysis]
half_life_hours = 720      # reviews are slower-moving than launch-week social posts
top_n = 6
use_llm = false            # theme grouping stays rule-based; the LLM reads direction via `fanpulse label`

[steam]                     # live data: set enabled = true and file.enabled = false
enabled = false
appid = 1127400
max_reviews = 20000
languages = ["english"]
min_playtime_hours = 1      # skip drive-by reviews

[file]                      # synthetic demo set; point at saved real reviews to use those
enabled = true
path = "data/mindustry_demo_reviews.json"
synthetic = true

[trace]
repo = "vendor/mindustry"
sources = ["core/src/**/*.java"]
max_files = 4
probe = ["java", "-Dprobe.sourcepath=vendor/mindustry/annotations/src/main/java", "-cp", "games/mindustry/build",
         "Probe", "vendor/mindustry-server.jar", "WaveMetric"]

# ---------------------------------------------------------------- themes
[themes.enemy_waves]
title = "Enemy waves difficulty"
kind = "balance"
patterns = ['\bwaves?\b', '\benem(y|ies)\b', '\bspawn', '\bboss', 'flying units?', '\bshields?\b',
            'over ?run', 'wiped', 'steamroll']
[themes.enemy_waves.trace]
metric = "threat"           # sum over waves of units x (health + shield), real Waves.generate output
topic = "how hard the enemy waves and attacks are"   # what the LLM is asked about
# must move with the target; boss_spike is reported but owned by the boss_warning feature
guardrails = ["units", "threat_early", "threat_mid", "threat_late", "threat"]
min_change = 0.05
max_change = 0.25
# "past wave 25", "around wave 30": measure the window players point at
focus = { pattern = 'wave (\d+)', windows = [[20, "threat_early"], [40, "threat_mid"], [9999, "threat_late"]] }

[themes.campaign_progression]
title = "Campaign is confusing / progression feels grindy"
kind = "qol"
patterns = ['campaign', 'tech tree', 'research', '\bsectors?\b', '\bgrind', 'tutorial', 'confus',
            'what to do', 'no idea how']

[themes.performance]
title = "Lag and frame drops in big factories"
kind = "performance"
patterns = ['\blag', '\bfps\b', 'crash', 'battery', 'stutter', 'freez', 'slows? down', 'overheat']

[themes.logistics_ui]
title = "Conveyor / building controls are fiddly (especially on mobile)"
kind = "qol"
patterns = ['conveyor', '\brouters?\b', '\bbelts?\b', 'placing', 'controls', 'schematic', 'touch', 'drag']

[themes.multiplayer]
title = "Multiplayer and servers"
kind = "feature_request"
patterns = ['multiplayer', '\bservers?\b', 'friends', 'co-?op', '\bhost']

# ---------------------------------------------------------------- needs (`fanpulse needs`)
# Areas Muse sorts each specific need into. Anything that fits none comes back as new:<name>, so this
# list steers the grouping without capping what players can ask for.
[needs.themes]
controls_ui = "building/placing controls, menus, camera, touch input, interface clarity"
unit_control = "commanding units, RTS-style control, unit AI and pathing"
onboarding = "tutorial, explaining mechanics, knowing what to do next"
campaign_grind = "research cost, resource grind, sector progression pace, tech tree"
saves_progress = "saves, undo, losing progress, sector loss, cloud sync"
wave_difficulty = "enemy wave strength, pacing, time between waves, boss waves"
enemy_variety = "new enemy types, wave composition, boss mechanics and warnings"
content = "new blocks, units, maps, planets, game modes"
version_changes = "changes between versions (v6/v7/v8) players want reverted or kept"
multiplayer = "servers, co-op, griefing, moderation, netcode"
performance = "lag, frame rate, crashes, battery, load times"
platform_price = "price, platform-specific issues (mobile, Steam vs free), DRM, achievements"

# ---------------------------------------------------------------- iterate (`fanpulse iterate`)
# What the probe can measure. A need no metric can show is routed to "design" and flagged, never faked.
[iterate]
coverage_target = 0.7     # share of the need's players a change must address (judged per player)
max_rounds = 3
guardrails = [{ metric = "threat_early", within = 0.02 }, { metric = "threat", within = 0.10 }]

[iterate.metrics]
units = "average enemy units per wave (waves 1-100, 3 difficulties x 5 seeds)"
threat_early = "enemy strength, waves 1-20 (units x health+shield)"
threat_mid = "enemy strength, waves 21-40"
threat_late = "enemy strength, waves 41-60"
threat = "enemy strength across all waves"
boss_spike = "how sharply a big-boss wave jumps above the 5 waves before it"
boss_warned = "share of big-boss waves preceded 2-6 waves earlier by a smaller guardian"

[iterate.tune]            # areas the numeric tuner can move, and the probe theme that holds their levers
wave_difficulty = "enemy_waves"

# ---------------------------------------------------------------- art (measured, not hand-written)
[art]
sprites = "core/assets-raw/sprites/units/*.png"
outline_source = ["core/src/mindustry/graphics/Pal.java", "core/src/mindustry/type/UnitType.java"]  # outlineColor = Pal.darkerMetal
outline_color_regex = 'darkerMetal = Color\.valueOf\("(\w+)"\)'
outline_radius_regex = 'outlineRadius = (\d+)'
size_examples = ["dagger", "mace", "fortress", "nova", "pulsar"]
conventions = ["mech legs are separate sprites drawn underneath, so do not draw legs or feet on the body"]
